name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Package
      placeholder: apps/web, apps/api, apps/indexer or packages/contracts
  - type: input
    id: chain
    attributes:
      label: Chain
      placeholder: Chain name and ID
